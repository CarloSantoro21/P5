name: Project p5-2

on:
  push:
    branches:
      - main

jobs:
  build-test:
    name: Build, test and publish artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Add coverage summary to job
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"]
                .map(k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
              console.log(["## Coverage", "| Metric | % | Covered |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist/
          if-no-files-found: error
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Deploy to Cloudflare (p5)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

  deploy-prod:
    name: Deploy to Prod (p7-prod)
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://p7-prod.alessandrosantoro212121.workers.dev
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist/
      - name: Deploy to Cloudflare (p7-prod)
        run: npx wrangler deploy dist/index.js --no-bundle --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
